version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: socorro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: socorro
      POSTGRES_PASSWORD: socorro123
      POSTGRES_DB: socorro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socorro -d socorro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: socorro_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@socorro.ao
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: socorro_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./socorro/backend
      dockerfile: Dockerfile
    container_name: socorro_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://socorro:socorro123@db:5432/socorro_db
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./socorro/backend:/app
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./socorro/frontend
      dockerfile: Dockerfile
    container_name: socorro_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./socorro/frontend/src:/app/src
      - ./socorro/frontend/public:/app/public
      - ./socorro/frontend/index.html:/app/index.html
      - ./socorro/frontend/tsconfig.json:/app/tsconfig.json
      - ./socorro/frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./socorro/frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  upload_data:
